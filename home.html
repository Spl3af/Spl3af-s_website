<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spl3af Code Bank</title>
  <style>
body {
background-color: #000;
color: #00ff00;
font-family: monospace;
}
    #topBanner {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: #000;
  z-index: 1000;
  transition: top 0.3s ease-in-out;
  text-align: center;
  padding: 20px 0;
}

.Banner {
  font-family: 'VT323', 'Courier New', monospace;
  font-size: 3.5rem;
  color: #00ff00;
  margin: 0;
  letter-spacing: 2px;
  text-shadow: 0 0 5px #00ff00;
}
        .glow {
      color: #00ff00;
      font-weight: bold;
      text-shadow: 0 0 5px #00ff00;
    }

  </style>
</head>
<body>
<header id="topBanner">
  <h1 class="Banner">SPL3AF SYSTEM INTERFACE</h1>
</header>
<main>
  <div style="height: 2000px; padding-top: 120px;">
    <p class="glow">Welcome to the Spl3af Code Bank. Scroll down to explore payloads and modules.</p>
  </div>
</main>

</body>
  <script>
  let lastScrollY = window.scrollY;

  window.addEventListener("scroll", () => {
    const banner = document.getElementById("topBanner");
    if (window.scrollY > lastScrollY && window.scrollY > 50) {
      banner.style.top = "-100px"; // Hide
    } else {
      banner.style.top = "0"; // Show
    }
    lastScrollY = window.scrollY;
  });
</script>
</html>
